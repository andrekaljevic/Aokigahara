<script type="module">
import * as THREE from 'three/webgpu';
import {pass,mrt,output,diffuseColor,normalView,packNormalToRGB,unpackRGBToNormal,sample,velocity,vec4,add} from 'three/tsl';

const N=4000,trunk=new THREE.InstancedMesh(new THREE.CylinderGeometry(.18,.3,14,8).translate(0,7,0),new THREE.MeshStandardMaterial({color:0x4a3b2e,roughness:.9}),N),crown=new THREE.InstancedMesh(new THREE.ConeGeometry(2.4,9,10).translate(0,13,0),new THREE.MeshStandardMaterial({color:0x2d4a24,roughness:.8}),N);
const m=new THREE.Matrix4();let k=0;for(let i=0;i<N;i++){const x=(Math.random()-.5)*400,z=(Math.random()-.5)*400;if(Math.hypot(x,z)<3)continue;const s=.7+Math.random()*.6;m.makeScale(s,s,s).setPosition(x,0,z);trunk.setMatrixAt(k,m);crown.setMatrixAt(k,m);k++;}

log.push('frame ms '+times.join(','));if(mode==='ssgi')pp.render();else renderer.render(scene,camera);window.__png=renderer.domElement.toDataURL('image/png');await new Promise(r=>requestAnimationFrame(r));window.__done=true;
}catch(e){log.push('ERR '+e.stack);window.__done=true;}
</script></body></html>
