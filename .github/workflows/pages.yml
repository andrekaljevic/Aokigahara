# Publish the explorable viewer to GitHub Pages.
#
# The site is a project page, so it serves under /<repo>/ — the artifact keeps the repository's
# own viewer/ and models/ layout because viewer/app.js resolves '../models/...' relative to
# viewer/, and a root redirect sends visitors straight in.
#
# Only viewer/ and models/ ship. The render evidence, research corpus, construction scripts and
# manifests stay in the repository and are not published.
name: Deploy viewer to Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit whose viewer/ and models/ to publish
        required: false
        default: dev/generational-visual-upgrade
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer one win rather than queueing behind a 116 MB upload.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The job runs on main so the github-pages environment accepts it, but the site is
          # built from whichever branch actually carries the world.
          ref: ${{ github.event.inputs.ref || 'dev/generational-visual-upgrade' }}
          lfs: false

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r viewer _site/viewer
          cp -r models _site/models
          # Jekyll would otherwise drop anything beginning with _ or . and slow the build down.
          touch _site/.nojekyll
          cp docs/pages-index.html _site/index.html
          echo "payload: $(du -sh _site | cut -f1)"
          # Fail loudly rather than deploying a site whose world cannot load.
          for f in viewer/index.html viewer/app.js viewer/assets/tree-library-v2.glb \
                   viewer/assets/tree-library-broadleaf.glb viewer/assets/forest-instances.f32 \
                   models/Aokigahara_Surface_Terrain.glb; do
            test -s "_site/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          # A Git LFS pointer left unresolved would be a small text file where a model should be.
          if head -c 40 "_site/models/Aokigahara_Surface_Terrain.glb" | grep -q 'git-lfs'; then
            echo "terrain is an unresolved LFS pointer"; exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
